[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "findobject"
version = "0.1.0"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["notebooks: executes every notebook top to bottom (needs datasets and trained runs; minutes)"]
addopts = "-m 'not notebooks'"  # opt in with: pytest -m notebooks
